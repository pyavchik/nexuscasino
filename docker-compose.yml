services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-casino-db
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_casino}
      POSTGRES_USER: ${DB_USER:-casino_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-casino_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-casino_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - casino-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-casino-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nexus_casino}
      DB_USER: ${DB_USER:-casino_user}
      DB_PASSWORD: ${DB_PASSWORD:-casino_pass}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - casino-network
    volumes:
      - maven_cache:/root/.m2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
    container_name: nexus-casino-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - casino-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app

volumes:
  postgres_data:
  maven_cache:

networks:
  casino-network:
    driver: bridge

