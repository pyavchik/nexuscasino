services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-casino-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_casino}
      POSTGRES_USER: ${DB_USER:-casino_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-casino_pass}
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-casino_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - casino-network

  backend:
    image: nexus-casino-backend:latest
    container_name: nexus-casino-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nexus_casino}
      DB_USER: ${DB_USER:-casino_user}
      DB_PASSWORD: ${DB_PASSWORD:-casino_pass}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://pyavchik.space,https://www.pyavchik.space,http://localhost:5173}
      # Email Configuration
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://pyavchik.space}
    # Backend port not exposed - only accessible via nginx frontend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - casino-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: nexus-casino-frontend:latest
    container_name: nexus-casino-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certificates
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Mount certbot webroot for ACME challenges
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - casino-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  casino-network:
    driver: bridge

