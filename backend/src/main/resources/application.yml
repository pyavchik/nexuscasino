spring:
  application:
    name: nexus-casino-backend
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_casino}
    username: ${DB_USER:casino_user}
    password: ${DB_PASSWORD:casino_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  websocket:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

logging:
  level:
    com.nexus.casino: DEBUG
    org.springframework.security: DEBUG

# Email Configuration
spring:
  mail:
    enabled: ${EMAIL_ENABLED:true}
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Application Configuration
app:
  frontend:
    url: ${FRONTEND_URL:https://pyavchik.space}

